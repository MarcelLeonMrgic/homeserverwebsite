<body>

  <!-- ===== MARQUEE ===== -->
  <div class="marquee" aria-hidden="true">
    <div class="marquee__track">
      <span class="marquee__item">
        Aus großer Kraft folgt große Verantwortung - Benjamin Parker &nbsp;///&nbsp;

      <span class="marquee__item">

  <!-- SVG-Filter: erst Graustufen, dann harte 2-Ton-Reduktion auf #000 / #EEE6C0 -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
    <filter id="duotone" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.299 0.587 0.114 0 0
                                           0.299 0.587 0.114 0 0
                                           0.299 0.587 0.114 0 0
                                           0     0     0     1 0" />
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 0.933" />
        <feFuncG type="discrete" tableValues="0 0.902" />
        <feFuncB type="discrete" tableValues="0 0.753" />
      </feComponentTransfer>
    </filter>
    </defs>
  </svg>

  <!-- ===== HERO / NEANDERTHAL ===== -->
  <header class="hero">
    <figure class="hero__figure">
      <!-- Aktuell Platzhalter. GIF von ArtStation als assets/neanderthal.gif ablegen
           und src unten umstellen. Ist der Download ein MP4, den <video>-Block nutzen.
           Der Pixel-/Duoton-Look kommt komplett aus CSS (.hero__media). -->
      <img class="hero__media" src="assets/neandertaler.gif" alt="Neandertaler" />
